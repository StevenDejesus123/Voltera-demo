# Railway deployment configuration

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "gcc",
  "glibc",
  "zlib",
  "libffi",
  "openssl",
  "stdenv.cc.cc.lib"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --only-binary=:all: -r requirements-prod.txt",
  "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "export LD_LIBRARY_PATH=$(dirname $(find /nix/store -name libstdc++.so.6 | head -n 1)):$LD_LIBRARY_PATH && /opt/venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"