# Railway deployment configuration

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "gcc",
  "glibc",
  "zlib",
  "libffi",
  "openssl"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "source /opt/venv/bin/activate",
  "pip install --only-binary=:all: -r requirements-prod.txt",
  "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "source /opt/venv/bin/activate && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"