# Railway deployment configuration
# Nixpacks auto-detects Node (package.json) and Python (requirements.txt).
# We only override install/build/start to wire them together correctly.

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
