# Railway deployment configuration
# Builds the React frontend, then starts FastAPI which serves both the API and the built app.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
