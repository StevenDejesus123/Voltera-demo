# Railway deployment configuration
# Explicitly install both Node and Python since nixpacks prioritises Node
# when package.json is present and skips Python auto-detection.

[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
    "python3 -m pip install -r requirements.txt",
    "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
