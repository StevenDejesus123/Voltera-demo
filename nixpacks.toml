# Railway deployment configuration

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
    "pip install -r requirements-prod.txt",
    "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
